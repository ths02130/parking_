<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖주은유로 주차장 계산기</title>

<style>
:root {
  --bg: #ffffff;
  --card: #f5f5f5;
  --text: #111111;
  --border: #dddddd;
  --button: #007aff;
}

body.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #f1f1f1;
  --border: #333333;
  --button: #0a84ff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 20px;
  transition: background 0.2s, color 0.2s;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

h1 {
  font-size: 22px;
  margin: 0;
}

button {
  font-size: 14px;
  padding: 6px 10px;
  background: var(--button);
  color: white;
  border: none;
  border-radius: 6px;
}

.section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-top: 18px;
}

input {
  width: 100%;
  font-size: 16px;
  padding: 8px;
  margin-top: 6px;
}

.result {
  font-size: 18px;
  margin-top: 15px;
}

/* 관리자 영역 숨김 */
.admin {
  display: none;
}
body.admin-mode .admin {
  display: block;
}
</style>
</head>

<body>

<div class="header">
  <h1>주은유로 주차장</h1>
  <div>
    <button onclick="toggleTheme()">🌙 / ☀️</button>
    <button onclick="toggleAdmin()">관리자</button>
  </div>
</div>

<!-- 관리자 전용 요금 설정 -->
<div class="section admin">
  <b>요금 설정</b><br><br>

  최초
  <input type="number" id="baseMinutes"> 분 /
  <input type="number" id="basePrice"> 원<br><br>

  이후
  <input type="number" id="unitMinutes"> 분마다
  <input type="number" id="unitPrice"> 원<br><br>

  1일 최대
  <input type="number" id="dailyMax"> 원
</div>

<!-- 일반 사용자 영역 -->
<div class="section">
  <b>주차 시간</b><br><br>
  입차 시각
  <input type="time" id="start"><br><br>
  출차 시각
  <input type="time" id="end"><br><br>
  <button onclick="calculate()">계산하기</button>
</div>

<div class="result" id="result"></div>

<script>
/* DOM 캐시 */
const baseMinutesEl = document.getElementById("baseMinutes");
const basePriceEl = document.getElementById("basePrice");
const unitMinutesEl = document.getElementById("unitMinutes");
const unitPriceEl = document.getElementById("unitPrice");
const dailyMaxEl = document.getElementById("dailyMax");
const startEl = document.getElementById("start");
const endEl = document.getElementById("end");
const resultEl = document.getElementById("result");

/* 다크모드 토글 + 기억 */
function toggleTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

/* 관리자 모드 토글 */
function toggleAdmin() {
  document.body.classList.toggle("admin-mode");
}

/* 요금 저장 */
function saveFeeRule() {
  const rule = {
    baseMinutes: baseMinutesEl.value,
    basePrice: basePriceEl.value,
    unitMinutes: unitMinutesEl.value,
    unitPrice: unitPriceEl.value,
    dailyMax: dailyMaxEl.value
  };
  localStorage.setItem("feeRule", JSON.stringify(rule));
}

/* 요금 불러오기 */
function loadFeeRule() {
  const saved = localStorage.getItem("feeRule");
  if (saved) {
    const r = JSON.parse(saved);
    baseMinutesEl.value = r.baseMinutes;
    basePriceEl.value = r.basePrice;
    unitMinutesEl.value = r.unitMinutes;
    unitPriceEl.value = r.unitPrice;
    dailyMaxEl.value = r.dailyMax;
  } else {
    baseMinutesEl.value = 30;
    basePriceEl.value = 1000;
    unitMinutesEl.value = 10;
    unitPriceEl.value = 500;
    dailyMaxEl.value = 20000;
  }
}

/* 계산 로직 */
function calculate() {
  saveFeeRule();

  const baseMinutes = +baseMinutesEl.value;
  const basePrice = +basePriceEl.value;
  const unitMinutes = +unitMinutesEl.value;
  const unitPrice = +unitPriceEl.value;
  const dailyMax = +dailyMaxEl.value;

  const start = startEl.value;
  const end = endEl.value;

  if (!start || !end) {
    alert("시간을 입력하세요");
    return;
  }

  let [sh, sm] = start.split(":").map(Number);
  let [eh, em] = end.split(":").map(Number);

  let s = sh * 60 + sm;
  let e = eh * 60 + em;
  if (e < s) e += 1440;

  const total = e - s;
  const h = Math.floor(total / 60);
  const m = total % 60;

  let fee = basePrice;
  if (total > baseMinutes) {
    fee += Math.ceil((total - baseMinutes) / unitMinutes) * unitPrice;
  }
  fee = Math.min(fee, dailyMax);

  resultEl.innerHTML =
    `이용 시간: ${h}시간 ${m}분<br>주차 요금: ${fee.toLocaleString()}원`;
}

/* 초기화 */
(function init() {
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }
  loadFeeRule();
})();
</script>

</body>
</html>
